name: Release Beta

# Every push to beta publishes a prerelease vX.Y.Z-beta.N with the lite client
# binaries, the Android APK and the Docker images (tag :beta).
#
# The release commit carries the version stamp and server/public, the web
# client built from the released source, so the tag is complete for a git
# install (install.sh, `neocloud update --tag`) as well as for the images.
#
# Its push uses GITHUB_TOKEN, which does not start other workflows, so the
# release commit triggers neither CI nor another release; the actor check
# below is a second guard for the same thing.

on:
  push:
    branches:
      - beta
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

# Releases queue up instead of cancelling one another: a cancelled run could
# leave a pushed tag without its release assets.
concurrency:
  group: release-beta
  cancel-in-progress: false

jobs:
  release:
    name: Tag beta release
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      release_sha: ${{ steps.sha.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: beta

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.5'
          cache: true

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Resolve next beta version
        id: version
        run: |
          git fetch --tags --force
          node scripts/next_beta_version.js >> "$GITHUB_OUTPUT"

      - name: Set package version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build bundled web client
        run: npm run flutter:build:web

      - name: Verify the bundle does not point at a dev server
        run: |
          if grep -Eq "localhost:3344|127\.0\.0\.1:3344" server/public/main.dart.js; then
            echo "::error::Bundled web client still points at a local dev server."
            exit 1
          fi

      - name: Commit and tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          git add package.json package-lock.json
          git add -f server/public
          # A rerun after a failed push finds the version already bumped.
          git diff --cached --quiet || git commit -m "chore(beta-release): ${RELEASE_TAG} [skip ci]"
          # Retry when beta moves between checkout and push (a merge landing
          # during the build). The next push to beta releases those commits.
          # The release commit only touches the version stamp and the bundle,
          # so on a conflict its own version of those wins.
          for attempt in 1 2 3 4 5; do
            git fetch origin beta
            git rebase -X theirs origin/beta
            git tag --force "$RELEASE_TAG" -m "Beta ${RELEASE_TAG}"
            if git push origin HEAD:beta; then
              git push origin "$RELEASE_TAG"
              exit 0
            fi
            echo "beta moved during the release push (attempt ${attempt}); retrying"
            sleep $((attempt * 5))
          done
          exit 1

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" \
                 --title "Beta ${RELEASE_TAG}" \
                 --generate-notes --prerelease --verify-tag

      - id: sha
        run: echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-clients:
    name: Build clients
    needs: release
    uses: ./.github/workflows/_build-clients.yml
    with:
      ref: ${{ needs.release.outputs.release_sha }}
      release_tag: ${{ needs.release.outputs.release_tag }}

  publish-docker-image:
    name: Publish Docker images
    needs: release
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_publish-docker-image.yml
    with:
      ref: ${{ needs.release.outputs.release_sha }}
      release_tag: ${{ needs.release.outputs.release_tag }}

  publish-release-assets:
    name: Publish release assets
    needs: [release, build-clients]
    permissions:
      contents: write
    uses: ./.github/workflows/_publish-release-assets.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
