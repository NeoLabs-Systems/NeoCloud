name: Release Manual

# Releases a chosen bump from the branch the run starts on, after CI.

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write
  actions: read

concurrency:
  group: release-stable
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Bump the version and tag
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      release_tag: ${{ steps.bump.outputs.release_tag }}
      release_sha: ${{ steps.sha.outputs.release_sha }}
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the update signing key
        uses: ./.github/actions/check-signing-key
        with:
          private_key: ${{ secrets.NEOCLOUD_RUNTIME_SIGNING_PRIVATE_KEY }}
      - uses: NeoLabs-Systems/neolabs-go/.github/actions/setup-go@1cd3668653c972a8c10cffcf52be95638bba74f8
      - uses: NeoLabs-Systems/neolabs-go/.github/actions/setup-flutter@1cd3668653c972a8c10cffcf52be95638bba74f8
      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump the version
        id: bump
        env:
          BUMP: ${{ inputs.version_bump }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          latest="$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          latest="${latest:-v0.1.0}"
          IFS=. read -r major minor patch <<< "${latest#v}"
          case "$BUMP" in
            major) next="$((major + 1)).0.0" ;;
            minor) next="${major}.$((minor + 1)).0" ;;
            *) next="${major}.${minor}.$((patch + 1))" ;;
          esac
          go run ./cmd/neocloud-release set-version "$next"
          echo "release_tag=v${next}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/build-web

      - name: Commit, tag and push
        env:
          RELEASE_TAG: ${{ steps.bump.outputs.release_tag }}
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add internal/buildinfo/version.go package.json package-lock.json
          git add -f flutter_app/build/web
          git commit -m "chore(release): ${RELEASE_TAG} [skip ci]"
          git tag "$RELEASE_TAG" -m "Release ${RELEASE_TAG}"
          git push --atomic origin "HEAD:refs/heads/${BRANCH}" "refs/tags/${RELEASE_TAG}"
          gh release create "$RELEASE_TAG" --title "Release ${RELEASE_TAG}" --generate-notes --draft --latest=false --verify-tag
          go run ./cmd/neocloud-release release-download --tag "$RELEASE_TAG"

      - id: sha
        run: echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-server:
    name: Build server
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/_build-server.yml
    secrets: inherit
    with:
      ref: ${{ needs.release.outputs.release_sha }}
      release_tag: ${{ needs.release.outputs.release_tag }}

  build-clients:
    name: Build clients
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/_build-clients.yml
    with:
      ref: ${{ needs.release.outputs.release_sha }}
      release_tag: ${{ needs.release.outputs.release_tag }}

  publish-docker-image:
    name: Publish Docker images
    needs: release
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_publish-docker-image.yml
    with:
      ref: ${{ needs.release.outputs.release_sha }}
      release_tag: ${{ needs.release.outputs.release_tag }}

  publish-release-assets:
    name: Publish release
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.build-server.result == 'success' }}
    needs: [release, build-server, build-clients]
    permissions:
      contents: write
    uses: ./.github/workflows/_publish-release-assets.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
      release_sha: ${{ needs.release.outputs.release_sha }}
      prerelease: false

  discard-draft-release:
    name: Discard the draft of a cancelled run
    if: ${{ cancelled() && needs.release.outputs.release_tag != '' }}
    needs: [release, build-server, publish-release-assets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.release_sha }}
      - uses: ./.github/actions/discard-draft-release
        with:
          release_tag: ${{ needs.release.outputs.release_tag }}
