name: Reusable client builds

# Builds the release clients for one ref: the Go lite client for every desktop
# platform and the Android APK. The artifacts are attached to the release by
# _publish-release-assets.yml.

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: true
        type: string
      release_tag:
        description: Release tag the binaries are versioned as (v1.2.3 or v1.2.3-beta.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  lite:
    name: Lite client ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS needs cgo for the tray (fyne.io/systray), so it builds natively.
          - { goos: darwin, goarch: arm64, runner: macos-latest, cgo: '1', ext: '' }
          - { goos: darwin, goarch: amd64, runner: macos-latest, cgo: '1', ext: '' }
          # Windows and Linux trays are pure Go: cross-compile with cgo off.
          - { goos: windows, goarch: amd64, runner: ubuntu-latest, cgo: '0', ext: '.exe' }
          - { goos: windows, goarch: arm64, runner: ubuntu-latest, cgo: '0', ext: '.exe' }
          - { goos: linux, goarch: amd64, runner: ubuntu-latest, cgo: '0', ext: '' }
          - { goos: linux, goarch: arm64, runner: ubuntu-latest, cgo: '0', ext: '' }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      # The Go version comes from clients/lite/go.mod, the single place it is pinned.
      - uses: actions/setup-go@v5
        with:
          go-version-file: clients/lite/go.mod
          cache-dependency-path: clients/lite/go.sum
      - name: Build
        working-directory: clients/lite
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXT: ${{ matrix.ext }}
        run: |
          mkdir -p dist
          name="neocloud-lite-${RELEASE_TAG}-${GOOS}-${GOARCH}${EXT}"
          go build -trimpath -ldflags "-s -w" -o "dist/$name" ./cmd/neocloud-lite
          echo "ARTIFACT=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: lite-${{ matrix.goos }}-${{ matrix.goarch }}
          path: clients/lite/dist/${{ env.ARTIFACT }}
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          # The build number is the commit count, which needs the history.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            flutter_app/android/**/*.gradle*
            flutter_app/android/gradle/wrapper/gradle-wrapper.properties
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.5'
          cache: true
      - name: Build release APK
        working-directory: flutter_app
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          version="${RELEASE_TAG#v}"
          # versionCode must only grow. run_number restarts per workflow, so a
          # stable APK would sort below the betas before it; the commit count
          # grows across beta and main.
          build_number="$(git rev-list --count HEAD)"
          flutter build apk --release --build-name "${version%%-*}" --build-number "$build_number"
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk "../dist/neocloud-${RELEASE_TAG}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error
