name: Release Stable

# Manual, from main: promotes beta to main, stamps the next stable version,
# builds the web client and publishes vX.Y.Z with the same artifacts as a beta
# release, moving the Docker :latest tag.
#
# dry_run merges and builds locally and prints the version it would release,
# without pushing, tagging or publishing anything.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (print the next version; push, tag and publish nothing)
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  actions: read

concurrency:
  group: release-stable
  cancel-in-progress: false

jobs:
  release:
    name: Promote beta and publish stable release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      release_sha: ${{ steps.sha.outputs.release_sha }}
    env:
      GOWORK: 'off'
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run Release Stable from main (it promotes beta into main)."
          exit 1

      # Promoting while a beta release is still pushing would ship a beta
      # without its version stamp and bundle commit.
      - name: Check no beta release is running
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # Runs not finished after 3 hours are stuck on GitHub's side (they
          # can be neither cancelled nor deleted), so they don't block.
          running="$(gh run list --repo "$REPOSITORY" --workflow release-beta.yml --limit 20 \
            --json status,createdAt --jq '[.[] | select(.status != "completed")
              | select((.createdAt | fromdateiso8601) > (now - 10800))] | length')"
          if [ "$running" != "0" ]; then
            echo "::error::A Release Beta run is still in progress; run this again when it has finished."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: NeoLabs-Systems/neolabs-go/.github/actions/setup-go@1cd3668653c972a8c10cffcf52be95638bba74f8

      # 3.35: pdfrx, the PDF viewer, does not build on newer Flutter before 3.50.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.5'
          cache: true

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge beta into main
        run: |
          git fetch origin main beta --tags --force
          if ! git merge --no-ff --no-commit origin/beta; then
            # main only receives promotions: the version stamp follows beta and
            # the bundle is rebuilt below.
            unexpected="$(git diff --name-only --diff-filter=U | grep -vE '^(internal/buildinfo/version\.go|package\.json|package-lock\.json|flutter_app/build/web/|server/public/)' || true)"
            if [ -n "$unexpected" ]; then
              echo "::error::Promoting beta conflicts with main outside generated files:"
              echo "$unexpected"
              exit 1
            fi
            git checkout origin/beta -- internal/buildinfo/version.go package.json package-lock.json
          fi
          git rm -rq --ignore-unmatch server/public flutter_app/build/web

      # The workflows and actions below come from the merged tree.
      - name: Check the update signing key
        uses: ./.github/actions/check-signing-key
        with:
          private_key: ${{ secrets.NEOCLOUD_RUNTIME_SIGNING_PRIVATE_KEY }}

      - name: Resolve and set the stable version
        id: version
        run: |
          go run ./cmd/neocloud-release resolve-version --channel stable --github-output
          go run ./cmd/neocloud-release set-version "$(go run ./cmd/neocloud-release resolve-version --channel stable)"

      - name: Run the server tests
        run: |
          go vet ./...
          go test -count=1 ./...

      - uses: ./.github/actions/build-web

      - name: Commit, tag and push
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "::error::${RELEASE_TAG} already exists."
            exit 1
          fi
          git add internal/buildinfo/version.go package.json package-lock.json
          git add -f flutter_app/build/web
          git commit -m "chore(release): ${RELEASE_TAG} [skip ci]"
          if [ "$DRY_RUN" = "true" ]; then
            echo "Would release ${RELEASE_TAG}."
            exit 0
          fi
          git tag "$RELEASE_TAG" -m "Release ${RELEASE_TAG}"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/${RELEASE_TAG}"

      - name: Create draft release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" \
                 --title "Release ${RELEASE_TAG}" \
                 --generate-notes --draft --latest=false --verify-tag
          go run ./cmd/neocloud-release release-download --tag "$RELEASE_TAG"

      - id: sha
        run: echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-server:
    name: Build server
    needs: release
    if: ${{ !inputs.dry_run }}
    permissions:
      contents: write
    uses: ./.github/workflows/_build-server.yml
    secrets: inherit
    with:
      ref: ${{ needs.release.outputs.release_sha }}
      release_tag: ${{ needs.release.outputs.release_tag }}

  build-clients:
    name: Build clients
    needs: release
    if: ${{ !inputs.dry_run }}
    permissions:
      contents: write
    uses: ./.github/workflows/_build-clients.yml
    with:
      ref: ${{ needs.release.outputs.release_sha }}
      release_tag: ${{ needs.release.outputs.release_tag }}

  publish-docker-image:
    name: Publish Docker images
    needs: release
    if: ${{ !inputs.dry_run }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_publish-docker-image.yml
    with:
      ref: ${{ needs.release.outputs.release_sha }}
      release_tag: ${{ needs.release.outputs.release_tag }}

  publish-release-assets:
    name: Publish release
    if: ${{ !inputs.dry_run && !cancelled() && needs.release.result == 'success' && needs.build-server.result == 'success' }}
    needs: [release, build-server, build-clients]
    permissions:
      contents: write
    uses: ./.github/workflows/_publish-release-assets.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
      release_sha: ${{ needs.release.outputs.release_sha }}
      prerelease: false

  notify-discord:
    name: Notify Discord
    needs:
      - release
      - publish-release-assets
    if: needs.release.outputs.release_tag != ''
    uses: ./.github/workflows/discord-release.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
    secrets:
      DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}

  discard-draft-release:
    name: Discard the draft of a cancelled run
    if: ${{ cancelled() && needs.release.outputs.release_tag != '' }}
    needs: [release, build-server, publish-release-assets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.release_sha }}
      - uses: ./.github/actions/discard-draft-release
        with:
          release_tag: ${{ needs.release.outputs.release_tag }}
