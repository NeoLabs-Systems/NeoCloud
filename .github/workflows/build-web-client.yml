name: Build Web Client

# server/public (the bundled Flutter web client) is generated output. Release
# Beta and Release Stable build it from the released source and commit it
# with the release, so every tag is complete for a git install. This workflow
# is the manual repair: it rebuilds the bundle on the chosen branch and
# commits it back.
#
# It used to run on every push to main and beta. That raced the beta release
# push, and the separate bot commits on main and beta made the promotion
# merge conflict on the bundle.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-web-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and commit bundled web client
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.5'
          cache: true

      - name: Build bundled web client
        run: npm run flutter:build:web

      - name: Verify the bundle does not point at a dev server
        run: |
          if grep -Eq "localhost:3344|127\.0\.0\.1:3344" server/public/main.dart.js; then
            echo "::error::Bundled web client still points at a local dev server."
            exit 1
          fi

      - name: Commit and push
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f server/public
          if git diff --cached --quiet; then
            echo "Web bundle unchanged."
            exit 0
          fi
          git commit -m "chore(web-client): rebuild bundled web client [skip ci]"
          # A release may push to the same branch meanwhile; retry on top of it.
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            git rebase -X theirs "origin/$BRANCH"
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            echo "$BRANCH moved during the push (attempt ${attempt}); retrying"
            sleep $((attempt * 5))
          done
          exit 1
