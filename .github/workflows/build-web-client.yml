name: Build Web Client

# flutter_app/build/web (served at /app) is generated output that travels with
# the checkout. Release Beta and Release Stable build it from the released
# source and commit it with the release, so every tag is complete. This
# workflow is the manual repair: it rebuilds the bundle on the chosen branch
# and commits it back.
#
# It does not run on pushes: that raced the beta release push, and separate bot
# commits on main and beta made the promotion merge conflict on the bundle.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-web-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and commit bundled web client
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: NeoLabs-Systems/neolabs-go/.github/actions/setup-go@1cd3668653c972a8c10cffcf52be95638bba74f8
      # 3.35: pdfrx, the PDF viewer, does not build on newer Flutter before 3.50.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.5'
          cache: true
      - uses: ./.github/actions/build-web

      - name: Commit and push
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f flutter_app/build/web
          if git diff --cached --quiet; then
            echo "Web bundle unchanged."
            exit 0
          fi
          git commit -m "chore(web-client): rebuild bundled web client [skip ci]"
          # A release may push to the same branch meanwhile; retry on top of it.
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            git rebase -X theirs "origin/$BRANCH"
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            echo "$BRANCH moved during the push (attempt ${attempt}); retrying"
            sleep $((attempt * 5))
          done
          exit 1
