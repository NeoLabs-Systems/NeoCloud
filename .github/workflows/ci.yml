name: CI

# Docs-only changes (docs/** and Markdown files) skip the test jobs. The
# workflow itself always runs and ends in "CI result", which passes when every
# job passed or was skipped: that is the one check to mark as required.

on:
  push:
    branches:
      - main
      - beta
  pull_request:
    branches:
      - main
      - beta
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A new push to a pull request supersedes its running checks; pushes to main
# and beta each keep their own result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # A pull request is checked out as a merge commit; its first parent
          # is the base branch. A push compares against the previous tip.
          if [ "$EVENT" = "pull_request" ]; then
            base="HEAD^1"
          else
            base="$BEFORE"
          fi
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "No usable base commit; running everything."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base" HEAD | grep -Ev '^docs/|\.md$' | grep -q .; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only documentation changed; skipping the test jobs."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  server:
    name: Go server (format, vet, lint, test)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: NeoLabs-Systems/neolabs-go/.github/actions/setup-go@1cd3668653c972a8c10cffcf52be95638bba74f8
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed:"; echo "$unformatted"; exit 1
          fi
      - run: go mod verify
      - run: go mod tidy -diff
      - run: go vet ./...
      # staticcheck.conf decides the checks: error texts are part of the API.
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      # Includes the replay of the Node.js updater handing over to the binary.
      - run: go test -race -count=1 ./...
      - name: Static builds
        env:
          CGO_ENABLED: '0'
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null ./cmd/neocloud
          done
      - name: Check shell scripts
        run: shellcheck --severity=error install.sh scripts/*.sh

  flutter:
    name: Flutter analyze and tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The neocloud_sync package tests build and start the real server (pairing
      # e2e) and run a Node vault interop fixture.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: NeoLabs-Systems/neolabs-go/.github/actions/setup-go@1cd3668653c972a8c10cffcf52be95638bba74f8
      # 3.35: pdfrx, the PDF viewer, does not build on newer Flutter before 3.50.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.5'
          cache: true
      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Analyze
        working-directory: flutter_app
        run: flutter analyze --no-pub
      - name: App tests
        working-directory: flutter_app
        run: flutter test --no-pub
      - name: Verify self-hosted Flutter web assets
        working-directory: flutter_app
        run: |
          flutter build web --no-web-resources-cdn --output "$RUNNER_TEMP/neocloud-web"
          cd .. && GOWORK=off go run ./cmd/neocloud-release check-web --web "$RUNNER_TEMP/neocloud-web"
      - name: neocloud_sync package tests
        working-directory: flutter_app/packages/neocloud_sync
        run: |
          dart pub get
          dart analyze
          dart test

  android:
    name: Android build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            flutter_app/android/**/*.gradle*
            flutter_app/android/gradle/wrapper/gradle-wrapper.properties
      # 3.35: pdfrx, the PDF viewer, does not build on newer Flutter before 3.50.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.5'
          cache: true
      - name: Build debug APK (compiles the Kotlin share intake)
        working-directory: flutter_app
        run: flutter build apk --debug

  lite-client:
    name: Lite client (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: clients/lite
    steps:
      - uses: actions/checkout@v4
      # The Go version comes from clients/lite/go.mod, the single place it is pinned.
      - uses: actions/setup-go@v5
        with:
          go-version-file: clients/lite/go.mod
          cache-dependency-path: clients/lite/go.sum
      - run: go vet ./...
      - run: go test ./...

  lite-client-e2e:
    name: Lite client end-to-end
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The tests build the server from the repository root, which needs the
      # newer of the two Go versions.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            clients/lite/go.sum
      - name: End-to-end against a real server
        working-directory: clients/lite
        run: go test -tags e2e ./e2e/...

  result:
    name: CI result
    if: always()
    needs: [changes, server, flutter, android, lite-client, lite-client-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All jobs passed or were skipped
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [ "$FAILED" = "true" ]; then
            echo "::error::At least one CI job failed or was cancelled."
            exit 1
          fi
