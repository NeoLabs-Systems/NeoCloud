name: CI

# Docs-only changes (docs/** and Markdown files) skip the test jobs. The
# workflow itself always runs and ends in "CI result", which passes when every
# job passed or was skipped: that is the one check to mark as required.

on:
  push:
    branches:
      - main
      - beta
  pull_request:
    branches:
      - main
      - beta
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes its running checks; pushes to main
# and beta each keep their own result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # A pull request is checked out as a merge commit; its first parent
          # is the base branch. A push compares against the previous tip.
          if [ "$EVENT" = "pull_request" ]; then
            base="HEAD^1"
          else
            base="$BEFORE"
          fi
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "No usable base commit; running everything."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base" HEAD | grep -Ev '^docs/|\.md$' | grep -q .; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only documentation changed; skipping the test jobs."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  server:
    name: Server tests (Node ${{ matrix.node-version }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  flutter:
    name: Flutter analyze and tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The neocloud_sync package tests start the real server (pairing e2e)
      # and run a Node vault interop fixture.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.5'
          cache: true
      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Analyze
        working-directory: flutter_app
        run: flutter analyze --no-pub
      - name: App tests
        working-directory: flutter_app
        run: flutter test --no-pub
      - name: neocloud_sync package tests
        working-directory: flutter_app/packages/neocloud_sync
        run: |
          dart pub get
          dart analyze
          dart test

  android:
    name: Android build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            flutter_app/android/**/*.gradle*
            flutter_app/android/gradle/wrapper/gradle-wrapper.properties
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.5'
          cache: true
      - name: Build debug APK (compiles the Kotlin share intake)
        working-directory: flutter_app
        run: flutter build apk --debug

  lite-client:
    name: Lite client (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: clients/lite
    steps:
      - uses: actions/checkout@v4
      # The Go version comes from clients/lite/go.mod, the single place it is pinned.
      - uses: actions/setup-go@v5
        with:
          go-version-file: clients/lite/go.mod
          cache-dependency-path: clients/lite/go.sum
      - run: go vet ./...
      - run: go test ./...

  lite-client-e2e:
    name: Lite client end-to-end
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-go@v5
        with:
          go-version-file: clients/lite/go.mod
          cache-dependency-path: clients/lite/go.sum
      - name: End-to-end against a real server
        working-directory: clients/lite
        run: go test -tags e2e ./e2e/...

  docker:
    name: Docker image builds
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  result:
    name: CI result
    if: always()
    needs: [changes, server, flutter, android, lite-client, lite-client-e2e, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All jobs passed or were skipped
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [ "$FAILED" = "true" ]; then
            echo "::error::At least one CI job failed or was cancelled."
            exit 1
          fi
