name: Attach release assets
description: Upload finished files to the release as soon as their build completes.
inputs:
  release_tag:
    description: Release tag to attach files to
    required: true
  files:
    description: Newline-separated file paths or glob patterns
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ inputs.release_tag }}
        FILE_PATTERNS: ${{ inputs.files }}
        REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        files=()
        while IFS= read -r pattern; do
          [ -n "$pattern" ] || continue
          for file in $pattern; do
            [ -f "$file" ] && files+=("$file")
          done
        done <<< "$FILE_PATTERNS"
        if [ "${#files[@]}" -eq 0 ]; then
          echo '::error::No release files found.'
          exit 1
        fi
        for attempt in 1 2 3 4 5; do
          if gh release upload "$RELEASE_TAG" "${files[@]}" --clobber --repo "$REPOSITORY"; then
            exit 0
          fi
          if [ "$attempt" -lt 5 ]; then
            sleep $((attempt * 3))
          fi
        done
        echo "::error::Could not attach files to $RELEASE_TAG."
        exit 1
